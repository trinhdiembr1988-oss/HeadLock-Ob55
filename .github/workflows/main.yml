name: Build HeadLock Ob55

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: HeadLock Ob55 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Locate Project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "PROJECT=." >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "::error::Không tìm thấy project Android hoặc ZIP."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::ZIP không có settings.gradle."
            find extracted -type f | sort
            exit 1
          fi

          echo "PROJECT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Verify
        shell: bash
        run: |
          cd "$PROJECT"

          echo "Project:"
          pwd

          if [ ! -d "app" ]; then
            echo "::error::Không có thư mục app."
            exit 1
          fi

          if [ ! -f "settings.gradle" ] &&
             [ ! -f "settings.gradle.kts" ]; then
            echo "::error::Thiếu settings.gradle."
            exit 1
          fi

          echo "Project OK"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          APK=$(find "$PROJECT" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "::error::Không tạo được APK."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/HeadLock-Ob55.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeadLock-Ob55
          path: HeadLock-Ob55.apk
          if-no-files-found: error
