name: Build AimLockOb55 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract AimLockOb55
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Không tìm thấy file ZIP"
            ls -la
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          echo "=== FILES AFTER EXTRACT ==="
          find project -maxdepth 5 -type f | sort

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS="$(find project -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \
          \) | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::ZIP không chứa settings.gradle"
            echo "Các file đã giải nén:"
            find project -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Android project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "=== PROJECT DIRECTORY ==="
          pwd

          echo "=== PROJECT FILES ==="
          find . -maxdepth 3 -type f | sort

          echo "=== SETTINGS ==="
          cat settings.gradle 2>/dev/null || cat settings.gradle.kts

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Find APK
        shell: bash
        run: |
          echo "=== APK ==="
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimLockOb55
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
