name: Build AimLockOb55

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "::error::Không tìm thấy file ZIP ở thư mục gốc."
            exit 1
          fi

          echo "Found: $ZIP"

          mkdir -p android-project
          unzip -q -o "$ZIP" -d android-project

          echo "=== FILES ==="
          find android-project -maxdepth 5 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find android-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Không tìm thấy settings.gradle trong ZIP."
            echo "ZIP hiện có các file:"
            find android-project -type f | sort
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          echo "PROJECT=$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android project
        shell: bash
        run: |
          cd "$PROJECT"

          echo "=== PROJECT ==="
          pwd

          echo "=== FILES ==="
          find . -maxdepth 3 -type f | sort

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "::error::Thiếu settings.gradle."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "::error::Thiếu thư mục app."
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Find APK
        shell: bash
        run: |
          echo "=== APK ==="
          find "$PROJECT" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimLockOb55
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
