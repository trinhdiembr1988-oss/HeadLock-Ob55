name: Build AimLockOb55

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "::error::Không tìm thấy file ZIP"
            exit 1
          fi

          mkdir -p android-project
          unzip -o "$ZIP" -d android-project

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find android-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Không tìm thấy settings.gradle"
            find android-project -type f | sort
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify project
        shell: bash
        run: |
          cd "$PROJECT"

          echo "=== PROJECT ==="
          pwd

          echo "=== FILES ==="
          find . -maxdepth 3 -type f | sort

          test -f settings.gradle || test -f settings.gradle.kts
          test -d app

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Find APK
        shell: bash
        run: |
          find "$PROJECT" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimLockOb55
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
