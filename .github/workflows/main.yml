name: Build AimLockOb55

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check Android project
        run: |
          echo "=== Files ==="
          find . -maxdepth 2 -type f | sort
          echo "=== Gradle ==="
          gradle --version

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimLockOb55
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
